; いろどり手帳の PHP 設定（開発用・本番用で共通。Dockerfile が conf.d/zz-irodori.ini として入れる）

; アップロードの上限
;   バックアップの読み込みは 5MB まで（DataController の max:5120）。PHP の標準（2MB / 8MB）だと 2MB を超えると受け取れないため広げる
;   nginx の client_max_body_size（20M）より小さく、アプリの上限より大きい値にする
upload_max_filesize = 8M
post_max_size = 10M

; 応答ヘッダーに PHP のバージョンを出さない
expose_php = Off
