# PHP のテストを、使い捨てのテスト用 MySQL 8.4 で動かす。実行は tests/mysql/run.sh から（直接 up しない）
#
# ・プロジェクト名は irodori-mysqltest → 開発用（task_app）・本番用（irodori-prod）とは別のコンテナ・ネットワーク
# ・MySQL のデータはメモリ上（tmpfs）。ボリュームを作らないので、止めると跡形もなく消える
# ・ネットワークは internal（外につながらない → LINE・Google には届かない）。開発用の MySQL（db）には名前も届かない
# ・PHP のコンテナには、開発用の .env の上にテスト専用の .env（tests/mysql/.runtime/.env）を読み取り専用で重ねる
name: irodori-mysqltest

services:
  mysqltest-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: irodori_test
      MYSQL_USER: irodori_test
      MYSQL_PASSWORD: irodori_test_only
      MYSQL_ROOT_PASSWORD: irodori_test_root_only
      TZ: Asia/Tokyo
    tmpfs:
      - /var/lib/mysql
    networks: [mysqltest]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pirodori_test_root_only"]
      interval: 2s
      timeout: 5s
      retries: 60

  php:
    build:
      context: ../../docker/php
      target: dev
    working_dir: /var/www/html
    volumes:
      - ../../:/var/www/html
      - ./.runtime/.env:/var/www/html/.env:ro
    networks: [mysqltest]
    environment:
      MYSQLTEST: "1"
    depends_on:
      mysqltest-db: { condition: service_healthy }

networks:
  mysqltest:
    internal: true
